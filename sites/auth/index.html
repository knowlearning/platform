<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-orange.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: sans-serif;
      }

      #error {
        padding: 1rem;
        text-align: center;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="error" role="alert" hidden></div>
    <script>
      const GOOGLE_CLIENT_ID = '603559646501-i29ma3u7c590ijimgp809vpdhg52jibd.apps.googleusercontent.com'
      const GOOGLE_OAUTH2_URL = 'https://accounts.google.com/o/oauth2/auth'

      const MICROSOFT_CLIENT_ID = 'c44ceeca-8f9a-49c2-9bea-cc7135da8943'
      const MICROSOFT_OAUTH2_URL = 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize'

      const CLASSLINK_CLIENT_ID = 'c17067461192207630e7cc2ae2d82cccf1f28f20bd10'
      const CLASSLINK_OAUTH2_URL = 'https://launchpad.classlink.com/oauth2/v2/auth'

      const LINE_CLIENT_ID = '2008017560'
      const LINE_OAUTH2_URL = 'https://access.line.me/oauth2/v2.1/authorize'
      const STATE_FALLBACK_PREFIX = 'KLAUTH1'
      const sensitiveValues = new Set()
      let authProvider = null
      let authStage = window.location.pathname === '/' ? 'callback' : 'redirect'
      let reportingError = false

      const CORE_AUTH_SERVICE_PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA59Uz6jvBJF3B8/7xMqGo
XkIhLFvTCHuFIGuCNNZGCJUnSk2ne6Jp1ehUIarliJwzrvfr2HMe0PvzAJyZqQIs
uz0Lt867TTojCAKJunxbcrwEhzvz0FNjNu1wpgkSHFvd1uTvRSZqauqUmG0HqC17
HSmBaXivB49B/pviowVJc+mUJJ9MROtOiL4JN5niHnLbt6QVi6NITAJkOwtoRhck
5j0KLvfrq18R8QrfDOq3v5hWlrA6j1wPvTW1mzFk8MrOZw935mMDdMivFAm/DltM
NT5I3YnLZpcl1e/fydC+B6zSz2nZfLb2iDBbADDVj2+i9JUEFomg6ng1DjHUGMYc
ZQIDAQAB
-----END PUBLIC KEY-----
`

      async function runAuth() {
        const params = new URLSearchParams(window.location.search)
        for (const [key, value] of params) {
          if (key !== 'error') sensitiveValues.add(value)
        }

        if (window.location.pathname !== '/') {
          const [, provider, state, encodedReturnUrl] = window.location.pathname.split('/')
          authProvider = provider
          sensitiveValues.add(state)
          sensitiveValues.add(encodedReturnUrl)
          const info = { origin: resolveAuthOrigin(encodedReturnUrl), provider }

          authStage = 'storage'
          const providerState = encodeFallbackState({
            state,
            provider,
            origin: new URL(info.origin).origin
          })
          sensitiveValues.add(providerState)
          try {
            const serializedInfo = JSON.stringify(info)
            window.localStorage.setItem(state, serializedInfo)
            if (window.localStorage.getItem(state) !== serializedInfo) {
              throw new Error('Auth storage did not retain the transaction')
            }
          }
          catch (error) {
            if (!canRecoverAuthState()) throw error
          }

          authStage = 'redirect'
          const query = {
            redirect_uri: window.location.origin + '/',
            response_type: 'code',
            nonce: Math.random().toString(36).substring(2),
            state: providerState
          }

          let url

          if (provider === 'google') {
            query.client_id = GOOGLE_CLIENT_ID
            query.prompt = 'select_account'
            query.scope = 'openid profile'
            url = GOOGLE_OAUTH2_URL
          }
          else if (provider === 'microsoft') {
            query.client_id = MICROSOFT_CLIENT_ID
            query.prompt = 'select_account'
            query.scope = 'openid profile'
            url = MICROSOFT_OAUTH2_URL
          }
          else if (provider === 'classlink') {
            query.client_id = CLASSLINK_CLIENT_ID
            query.prompt = 'select_account'
            query.scope = 'profile'
            url = CLASSLINK_OAUTH2_URL
          }
          else if (provider === 'line') {
            query.client_id = LINE_CLIENT_ID
            query.scope = 'openid profile'
            url = LINE_OAUTH2_URL
          }
          else {
            query.origin = info.origin
            url = `https://${provider}`
          }

          window.location.href = `${url}?${objectToQuerystring(query)}`
        }
        else {
          const { state, code, error } = Object.fromEntries(params)
          if (params.has('error')) throw new Error(`OAuth error: ${error}`)
          if (!window.location.search) return
          if (!code || !state) throw new Error('Missing auth callback code or state')

          let originalState = state
          let fallbackInfo
          let info

          if (state.startsWith(STATE_FALLBACK_PREFIX)) {
            fallbackInfo = parseFallbackState(state)
            originalState = fallbackInfo.state
          }
          sensitiveValues.add(originalState)

          authStage = 'storage'
          try {
            info = parseAuthInfo(window.localStorage.getItem(originalState))
            try { window.localStorage.removeItem(originalState) }
            catch {}
          }
          catch (error) {
            if (!fallbackInfo || !canRecoverAuthState()) throw error
            info = fallbackInfo
          }
          const { origin, provider } = info
          authProvider = provider
          authStage = 'callback'
          const { protocol, host } = new URL(origin)

          authStage = 'encryption'
          const tokenContents = { code, provider, domain: host }
          const encryptedToken = await encryptString(CORE_AUTH_SERVICE_PUBLIC_KEY, JSON.stringify(tokenContents))
          sensitiveValues.add(encryptedToken)
          authStage = 'redirect'
          window.location.href = `${protocol}//${host}/auth/${originalState}/${encryptedToken}`
        }
      }

      function showError(message) {
        const element = document.getElementById('error')
        element.textContent = `Error: ${message}`
        element.hidden = false
      }

      function redactErrorText(value) {
        let text = String(value ?? '')
        for (const secret of [...sensitiveValues].filter(Boolean).sort((first, second) => second.length - first.length)) {
          text = text.split(secret).join('[redacted]')
          text = text.split(encodeURIComponent(secret)).join('[redacted]')
        }
        return text.replace(/https?:\/\/[^\s)]+/g, '[url]')
      }

      function getBrowserInfo() {
        const browser = {}
        const fields = {
          userAgent: 'string',
          vendor: 'string',
          platform: 'string',
          language: 'string',
          maxTouchPoints: 'number',
          cookieEnabled: 'boolean',
          onLine: 'boolean'
        }
        for (const [field, type] of Object.entries(fields)) {
          browser[field] = null
          try {
            const value = window.navigator?.[field]
            if (typeof value !== type || (type === 'number' && !Number.isFinite(value))) continue
            browser[field] = type === 'string' ? redactErrorText(value) : value
          }
          catch {}
        }
        return browser
      }

      async function reportError(error) {
        if (reportingError) return
        reportingError = true
        showError('reporting…')

        let agent
        let timeout
        let finished = false
        try {
          const report = {
            type: 'auth-error',
            name: redactErrorText(error?.name || 'Error'),
            message: redactErrorText(error?.message ?? error),
            stack: redactErrorText(error?.stack),
            timestamp: new Date().toISOString(),
            provider: authProvider ? redactErrorText(authProvider) : null,
            stage: authStage,
            browser: null
          }
          try { report.browser = getBrowserInfo() }
          catch {}
          const saveReport = async () => {
            const agentsUrl = '/agents.js'
            const { default: createAgent } = await import(agentsUrl)
            if (finished) return
            agent = createAgent()
            const id = agent.uuid()
            const response = await agent.interact(id, [
              { op: 'add', path: ['active_type'], value: 'application/json' },
              { op: 'add', path: ['active'], value: report }
            ])
            if (!Number.isInteger(response?.ii) || response.ii < 0) throw new Error('Report was not saved')
            return id
          }
          const id = await Promise.race([
            saveReport(),
            new Promise((resolve, reject) => {
              timeout = setTimeout(() => reject(new Error('Error report timed out')), 10000)
            })
          ])
          showError(id)
        }
        catch (reportingFailure) {
          console.warn('Could not save auth error report', reportingFailure)
          showError('report unavailable')
        }
        finally {
          finished = true
          clearTimeout(timeout)
          try { agent?.disconnect() }
          catch (disconnectError) { console.warn('Could not disconnect error reporter', disconnectError) }
        }
      }

      function parseAuthInfo(value) {
        let info
        try { info = JSON.parse(value) }
        catch { throw new Error('Invalid auth transaction JSON') }
        if (!info) throw new Error('Missing auth transaction')
        if (
          typeof info.provider !== 'string' || !info.provider.trim() ||
          typeof info.origin !== 'string'
        ) {
          throw new Error('Invalid auth transaction')
        }

        const origin = new URL(info.origin)
        if (
          !['http:', 'https:'].includes(origin.protocol) ||
          origin.username || origin.password
        ) {
          throw new Error('Invalid auth transaction origin')
        }
        return info
      }

      function resolveAuthOrigin(encodedReturnUrl) {
        if (document.referrer) return document.referrer
        if (!canRecoverAuthState()) throw new Error('Missing auth referrer')
        if (!encodedReturnUrl) throw new Error('Missing auth return URL')

        let returnUrl
        try { returnUrl = new URL(decodeURIComponent(encodedReturnUrl)) }
        catch { throw new Error('Invalid auth return URL') }
        if (
          !['http:', 'https:'].includes(returnUrl.protocol) ||
          returnUrl.username || returnUrl.password
        ) {
          throw new Error('Invalid auth return URL')
        }
        return returnUrl.origin
      }

      function canRecoverAuthState() {
        const { userAgent = '', platform = '', maxTouchPoints = 0 } = window.navigator || {}
        const isMac = /Macintosh/i.test(userAgent) || platform === 'MacIntel'
        const isIOS = /iPad|iPhone|iPod/i.test(userAgent) || (isMac && maxTouchPoints > 1)
        const isSafari = isMac && /Version\//i.test(userAgent) && /Safari\//i.test(userAgent) &&
          !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Opera|Android/i.test(userAgent)
        return isIOS || isSafari
      }

      function encodeFallbackState(info) {
        const bytes = new TextEncoder().encode(JSON.stringify(info))
        return STATE_FALLBACK_PREFIX + Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('')
      }

      function parseFallbackState(state) {
        const encoded = state.slice(STATE_FALLBACK_PREFIX.length)
        if (!/^(?:[0-9a-f]{2})+$/.test(encoded)) throw new Error('Invalid auth fallback encoding')
        const bytes = Uint8Array.from(encoded.match(/../g), pair => parseInt(pair, 16))
        const info = parseAuthInfo(new TextDecoder('utf-8', { fatal: true }).decode(bytes))
        if (typeof info.state !== 'string' || !/^[a-zA-Z0-9_-]+$/.test(info.state)) {
          throw new Error('Invalid auth fallback state')
        }

        return info
      }

      function parseHash(hash) {
        const params = hash.substr(1).split('&')
        const result = {}
        params.forEach(param => {
          const parts = param.split('=')
          result[parts[0]] = parts[1]
        })
        return result
      }

      function objectToQuerystring(o) {
        return Object.entries(o).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&')
      }

      async function encryptString(publicKeyPem, plainText) {
        const publicKey = await crypto.subtle.importKey(
          'spki',
          pemToArrayBuffer(publicKeyPem),
          { name: 'RSA-OAEP', hash: 'SHA-256' },
          true,
          ['encrypt']
        )

        const symmetricKey = await crypto.subtle.generateKey(
          { name: 'AES-GCM', length: 256 },
          true,
          ['encrypt', 'decrypt']
        )

        const encodedPlainText = new TextEncoder().encode(plainText);
        const iv = crypto.getRandomValues(new Uint8Array(12))
        const encryptedData = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          symmetricKey,
          encodedPlainText
        )

        const exportedSymmetricKey = await crypto.subtle.exportKey('raw', symmetricKey)

        const encryptedSymmetricKey = await crypto.subtle.encrypt(
          { name: 'RSA-OAEP' },
          publicKey,
          exportedSymmetricKey
        )

        const serialized = [
          encodeURIComponent(btoa(String.fromCharCode(...new Uint8Array(iv)))),
          encodeURIComponent(btoa(String.fromCharCode(...new Uint8Array(encryptedData)))),
          encodeURIComponent(btoa(String.fromCharCode(...new Uint8Array(encryptedSymmetricKey))))
        ].join(',')

        return serialized
      }

      function pemToArrayBuffer(pem) {
        const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s/g, '')
        const binary = atob(b64)
        const array = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i++) {
          array[i] = binary.charCodeAt(i)
        }
        return array.buffer
      }

      window.addEventListener('error', event => reportError(event.error || new Error(event.message)))
      window.addEventListener('unhandledrejection', event => reportError(event.reason))
      runAuth().catch(reportError)
    </script>
  </body>
</html>
