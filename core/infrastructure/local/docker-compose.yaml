services:
  gcs-emulator:
    image: fsouza/fake-gcs-server:1.49.3
    container_name: gcs-emulator
    ports:
      - 4443:4443
      - 8000:8000
    volumes:
      - ./files:/data/local-gcs-bucket
    command: >
      -scheme both
      -port 4443
      -port-http 8000
      -log-level debug
      -cors-headers x-upload-content-type,x-goog-content-sha256,x-goog-resumable,x-goog-meta-user,x-goog-meta-type,x-goog-meta-name,x-goog-meta-edit,x-goog-meta-view,x-goog-meta-base,x-goog-meta-domain
      -external-url https://localhost:4443
      -public-host localhost

  postgres:
    image: postgres:alpine3.18
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=insecure-development-password

  api:
    build: 
      context: ../../
      dockerfile: deno.Dockerfile
    ports:
      - 8765:8765
    container_name: api
    environment:
      - TLS_PORT=8765
      - AUTH_SERVICE_SECRET_KEY=${AUTH_SERVICE_SECRET_KEY}
      - OAUTH_CREDENTIALS=${OAUTH_CREDENTIALS}
      - INSECURE_DEVELOPMENT_CERT=${INSECURE_DEVELOPMENT_CERT}
      - INSECURE_DEVELOPMENT_KEY=${INSECURE_DEVELOPMENT_KEY}
      - MODE=local
      - PORT=8000
      - SERVE_HOST=serve:8765
      - SERVICE_ACCOUNT_TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
      - REDIS_PASSWORD=
      - POSTGRES_PASSWORD=insecure-dev-password
      - PUBLIC_ENCRYPTION_KEY=x
      - SECRET_ENCRYPTION_KEY=x
      - ADMIN_DOMAIN=localhost:5111
      - GC_PROJECT_ID=opensourcelearningplatform
      - INTERNAL_GCS_API_ENDPOINT=http://gcs-emulator:8000
      - EXTERNAL_GCS_API_ENDPOINT=https://localhost:4443
      - GCS_BUCKET_NAME=local-gcs-bucket
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=insecure-development-password
      - GCS_SERVICE_ACCOUNT_CREDENTIALS=${GCS_SERVICE_ACCOUNT_CREDENTIALS}
    volumes:
      - ../../../packages/agents:/agents
    depends_on:
      - postgres
      - gcs-emulator
      - redis

  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: redis
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=
